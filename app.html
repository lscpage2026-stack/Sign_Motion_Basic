<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMOTION BASIC | Traductor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="top-bar">
        <div class="user-info">
            <span class="welcome-text">Hola, <span id="user-name">Usuario</span> 👋</span>
        </div>
        <button id="btnLogout" class="btn-logout-custom">
            <span>Cerrar Sesión</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
            </svg>
        </button>
    </div>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">SIGMOTION BASIC</h1>
            <p class="text-muted">Traductor de Lengua de Señas</p>
        </div>

        <div class="app-container p-4 shadow-sm bg-white rounded-4">
            <div class="row g-4">
                <div class="col-lg-5">
                    <label class="fw-bold mb-2">Escribe una palabra:</label>
                    <input type="text" id="userInput" class="form-control custom-input mb-3" placeholder="Ej: algunos">
                    <div id="errorMsg" class="text-danger mb-3 small fw-bold"></div>
                    <button class="btn btn-primary w-100 mb-4" id="btnBuscar" style="border-radius: 10px; padding: 12px; font-weight: 600;">✨ Traducir</button>
                    
                    <div class="dictionary-wrapper p-3 border rounded bg-light">
                        <p class="fw-bold mb-2 small text-uppercase">Diccionario</p>
                        <ul id="listaPalabras" class="list-unstyled small text-muted">
                            <li>Busca palabras como: "hola", "gracias", "clima".</li>
                        </ul>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div id="videoContainer" class="video-output-area border rounded-4 d-flex align-items-center justify-content-center bg-black shadow" style="min-height: 400px; overflow: hidden;">
                        <video id="v-player" class="w-100 d-none" controls>
                            <source id="v-source" src="" type="video/mp4">
                        </video>
                        <div id="v-placeholder" class="text-white text-center">
                            <p class="opacity-50">Aquí verás la seña</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/conexion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
