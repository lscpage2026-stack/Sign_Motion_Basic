<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | SIGMOTION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-style.css">
    <style>
        /* Ajuste para que el error no ocupe espacio si no hay mensaje */
        .error-text {
            display: none;
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-content">
            
            <div class="brand-section text-center">
                <img src="assets/imagenes/Saludo_Inicio_Sesio.gif" alt="Panda Saludando" class="panda-logo-img">
                <h1 class="brand-title mt-3">SIGMOTION</h1>
                <p class="brand-slogan">Comienza tu aprendizaje hoy</p>
            </div>

            <div class="login-card text-center">
                <h2 class="login-title">Crea tu cuenta</h2>
                <p class="login-subtitle mb-4">Únete para aprender lengua de señas</p>

                <form id="registroForm">
                    <div class="mb-3">
                        <input type="text" id="regNombre" class="form-control custom-input-login" placeholder="Nombre completo" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" id="regEmail" class="form-control custom-input-login" placeholder="Correo electrónico" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" id="regPass" class="form-control custom-input-login" placeholder="Contraseña" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" id="regPassConfirm" class="form-control custom-input-login" placeholder="Confirma tu contraseña" required>
                    </div>

                    <p id="errorRegistro" class="error-text"></p>

                    <button type="button" id="btnRegistrar" class="btn-login-main w-100 mb-3">Crear Cuenta</button>

                    <p class="footer-login mt-2">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
                </form>
            </div>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>   
    <script src="js/config.js"></script>   
    <script src="js/conexion.js"></script> 
    <script src="js/registro.js"></script>

</body>
</html>
